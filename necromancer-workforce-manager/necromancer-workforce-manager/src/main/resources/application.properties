spring.application.name=necromancer-workforce-manager

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/necromancer_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:PleaseTeacherWriteToMeInTeamsToGetAPassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

weather.api.base-url=${WEATHER_API_BASE_URL:https://api.weatherapi.com/v1}
weather.api.key=${WEATHER_API_KEY:efc17e2de8ac4a0c993135350262704}
weather.api.location=${WEATHER_API_LOCATION:43.238949,76.889709}